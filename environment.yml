name: pns
channels:
  - conda-forge
dependencies:
  - python=3.12          # 3.10 is EOL (Oct 2026); fall back to 3.11 if the IBL stack fails to install
  - numba            # from conda-forge: pip has no llvmlite wheel for Intel macOS and fails to build it
  - pip
  - pip:
      - ONE-api==3.6.2
      - ibllib==4.1.1
      - iblatlas==1.3.1
      - pandas<3
      - numpy
      - scipy
      - scikit-learn
      - pyarrow
      - matplotlib
      - joblib
      - pytest
      - pyyaml
      # then: git clone https://github.com/int-brain-lab/paper-brain-wide-map && pip install -e paper-brain-wide-map
      # then: pip install -e .   (this project)
